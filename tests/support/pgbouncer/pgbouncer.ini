; PgBouncer in transaction mode for SYMMETRIA_TEST_TRANSACTION_POOLING=1 runs
; (see tests/README.md). The test suites isolate schemas with
; `options=-c search_path=…`, which PgBouncer can keep per client only for
; PostgreSQL 18+, the first version that reports search_path.
[databases]
* = host=symmetria-pooling-postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
; 0 makes Bun.SQL's named statements fail, as with poolers that do not track
; them; the suites pass `prepare: false` in this mode.
max_prepared_statements = 0
track_extra_parameters = search_path,IntervalStyle
ignore_startup_parameters = extra_float_digits
admin_users = postgres
