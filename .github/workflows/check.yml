name: Check
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  integration:
    name: Packages, PostgreSQL ${{ matrix.postgres }} and examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported major and the current release.
        postgres: [14, 17]
    services:
      postgres:
        # The official postgres image plus pgvector, so vector suites run in CI.
        image: pgvector/pgvector:pg${{ matrix.postgres }}
        env:
          POSTGRES_USER: symmetria
          POSTGRES_PASSWORD: symmetria
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U symmetria -d testdb" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SYMMETRIA_TEST_DATABASE_URL: postgres://symmetria:symmetria@localhost:5432/testdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run test:packages
      - run: bun run test:integration
      - run: bun run test:drivers
      - run: bun run test:examples
