<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Symmetria — animated wordmark cover</title>
  <desc id="description">Symmetria in a minimal sans-serif wordmark beside a mirrored ribbon of blue, violet and pink light. Fine filaments breathe, luminous particles follow the continuous curve, and distant points slowly orbit the composition.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080e1d"/><stop offset=".5" stop-color="#101027"/><stop offset="1" stop-color="#160d20"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="-190" y1="0" x2="190" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59bcff"/><stop offset=".48" stop-color="#aca0ff"/><stop offset="1" stop-color="#f68bda"/>
    </linearGradient>
    <radialGradient id="blue"><stop stop-color="#418fff" stop-opacity=".2"/><stop offset="1" stop-color="#418fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#c45cf5" stop-opacity=".2"/><stop offset="1" stop-color="#c45cf5" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette"><stop offset=".35" stop-color="#080b16" stop-opacity="0"/><stop offset="1" stop-color="#080b16" stop-opacity=".5"/></radialGradient>
    <filter id="glow" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="point" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="ribbon" pathLength="1000" d="M0 0C-70-108-174-108-174 0S-70 108 0 0C70-108 174-108 174 0S70 108 0 0Z"/>
    <clipPath id="bounds"><rect x="1" y="1" width="1278" height="478" rx="24"/></clipPath>
  </defs>
  <style>
    .current { stroke-dasharray: 4 996; animation: current 10s linear infinite; }
    .second { animation-delay: -5s; }
    .third { animation-delay: -2.5s; }
    .fourth { animation-delay: -7.5s; }
    .drift { animation: drift 14s ease-in-out infinite; }
    .breathe { animation: breathe 7s ease-in-out infinite; }
    .orbit { animation: orbit 65s linear infinite; }
    .counter { animation: orbit 85s linear infinite reverse; }
    .halo { animation: halo 12s ease-in-out infinite; }
    @keyframes current { to { stroke-dashoffset: -1000; } }
    @keyframes drift { 0%,100% { transform: rotate(-24deg); } 50% { transform: rotate(-17deg); } }
    @keyframes breathe { 0%,100% { opacity: .4; } 50% { opacity: .85; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes halo { 0%,100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.12); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .current,.drift,.breathe,.orbit,.counter,.halo { animation: none; }
      .drift { transform: rotate(-24deg); }
    }
  </style>
  <rect x="1" y="1" width="1278" height="478" rx="24" fill="url(#background)" stroke="#252b42"/>
  <g clip-path="url(#bounds)">
    <g transform="translate(640 240)">
      <g class="halo">
        <ellipse cx="-160" cy="65" rx="390" ry="260" fill="url(#blue)"/>
        <ellipse cx="160" cy="-65" rx="390" ry="260" fill="url(#pink)"/>
      </g>
      <ellipse rx="565" ry="187" stroke="#a5a5f6" stroke-opacity=".06"/>
      <ellipse rx="480" ry="213" stroke="#a5a5f6" stroke-opacity=".05"/>
      <g transform="scale(1.6 .68)">
        <g class="orbit">
          <circle r="270" stroke="#a5a5f6" stroke-opacity=".055"/>
          <circle cx="270" r="2" fill="#b8bbf8" opacity=".6"/>
          <circle cx="-270" r="2" fill="#b8bbf8" opacity=".6"/>
        </g>
      </g>
      <g transform="scale(1.8 .76)">
        <g class="counter">
          <circle cy="230" r="1.5" fill="#e2c3ff" opacity=".65"/>
          <circle cy="-230" r="1.5" fill="#b3dcff" opacity=".65"/>
        </g>
      </g>
      <g transform="translate(-370 0) scale(.95)">
        <g class="drift" transform="rotate(-24)">
          <use href="#ribbon" stroke="url(#spectrum)" stroke-width="30" opacity=".55" filter="url(#glow)" class="breathe"/>
          <g stroke="url(#spectrum)">
            <use href="#ribbon" transform="scale(1.12 1.48)" stroke-width=".5" opacity=".12"/>
            <use href="#ribbon" transform="scale(1.09 1.36)" stroke-width=".6" opacity=".2"/>
            <use href="#ribbon" transform="scale(1.06 1.24)" stroke-width=".7" opacity=".35"/>
            <use href="#ribbon" transform="scale(1.03 1.12)" stroke-width=".9" opacity=".6"/>
            <use href="#ribbon" stroke="#0c1024" stroke-width="12"/>
            <use href="#ribbon" stroke-width="5"/>
            <use href="#ribbon" transform="scale(.97 .88)" stroke-width=".9" opacity=".65"/>
            <use href="#ribbon" transform="scale(.94 .76)" stroke-width=".7" opacity=".4"/>
            <use href="#ribbon" transform="scale(.91 .64)" stroke-width=".6" opacity=".25"/>
            <use href="#ribbon" transform="scale(.88 .52)" stroke-width=".5" opacity=".12"/>
          </g>
          <g stroke-linecap="round">
            <use href="#ribbon" stroke="#e5e5ff" stroke-width="6" filter="url(#point)" class="current"/>
            <use href="#ribbon" stroke="#e5e5ff" stroke-width="6" filter="url(#point)" class="current second"/>
            <use href="#ribbon" stroke="#f6eeff" stroke-width="2.5" class="current"/>
            <use href="#ribbon" stroke="#f6eeff" stroke-width="2.5" class="current second"/>
            <use href="#ribbon" transform="scale(1.03 1.12)" stroke="#cfdbff" stroke-width="1.5" class="current third"/>
            <use href="#ribbon" transform="scale(.97 .88)" stroke="#eccaff" stroke-width="1.5" class="current fourth"/>
          </g>
        </g>
      </g>
    </g>
    <rect width="1280" height="480" fill="url(#vignette)"/>
    <!-- Avenir Next Medium, outlined for consistent rendering. -->
    <g id="wordmark" transform="translate(516 270) scale(.128 -.128)" fill="#eeedf5">
